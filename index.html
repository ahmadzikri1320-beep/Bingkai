<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanvas Warna-Warni</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f7ff;--panel:#fff;--ink:#2d3a5a;--line:#2d3a5a;--accent:#ff6f61;--accent2:#ffd23f;--sel:#3a86ff;--shadow:#2d3a5a;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2540;--panel:#2b3558;--ink:#eaf4ff;--line:#eaf4ff;--shadow:#0e1427}}
:root[data-theme="dark"]{--bg:#1d2540;--panel:#2b3558;--ink:#eaf4ff;--line:#eaf4ff;--shadow:#0e1427}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka','Baloo 2','Comic Sans MS','Trebuchet MS',sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1000px;margin:0 auto;padding:12px;display:grid;gap:12px}
h1{margin:0;font-size:clamp(1.5rem,5vw,2.2rem);text-align:center;font-weight:700}
.sub{margin:2px 0 0;text-align:center;opacity:.8}
.main{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:820px){.main{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.card{background:var(--panel);border:3px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--shadow);padding:12px}
.paper{display:flex;justify-content:center;padding:10px}
.stage{position:relative;width:100%;max-width:600px;aspect-ratio:1;background:#fff;border:8px solid #c96d4b;border-radius:7%;overflow:hidden;touch-action:none;cursor:crosshair}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel{display:grid;gap:14px}
.lbl{font-weight:700;font-size:1.05rem;margin:0 0 8px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font-family:inherit;color:var(--ink)}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:3px solid var(--line);border-radius:18px;background:var(--panel);font-size:.95rem;font-weight:600;cursor:pointer;min-height:64px}
.tool span{font-size:1.6rem;line-height:1}
.tool:active{transform:scale(.94)}
.tool[aria-pressed="true"]{background:var(--accent2);color:#2d3a5a;box-shadow:0 4px 0 var(--shadow);transform:translateY(-2px)}
.colors{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.sw:active{transform:scale(.88)}
.sw[aria-pressed="true"]{outline:4px solid var(--sel);outline-offset:2px;transform:scale(1.1)}
.sw.custom{background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red);position:relative;overflow:hidden}
.sw.custom input{position:absolute;inset:-10px;opacity:0;width:150%;height:150%;cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
#cur{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);flex:none}
#size{flex:1;accent-color:var(--accent);height:32px}
#dot{width:44px;height:44px;display:grid;place-items:center;flex:none}
#dot i{display:block;border-radius:50%;background:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{padding:12px;border:3px solid var(--line);border-radius:18px;font-size:1.05rem;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--shadow);min-height:54px}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.act.alt{background:#4cc9f0;color:#102a43}
.act.save{grid-column:1/-1;background:#3cc76a;color:#08301a}
.act:disabled{opacity:.45;cursor:default}
#msg{min-height:1.4em;text-align:center;font-weight:600;margin:0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:9}
#ov[hidden]{display:none}
#ov .box{background:var(--panel);border:3px solid var(--line);border-radius:24px;padding:14px;max-width:460px;width:100%;max-height:100%;overflow:auto;display:grid;gap:10px;text-align:center}
#ov img{width:100%;border-radius:16px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#ov p{margin:0;font-weight:600}
:focus-visible{outline:4px solid var(--sel);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <h1>🎨 Kanvas Warna-Warni</h1>
  <p class="sub">Gambar dan warnai sesukamu, lalu simpan hasilnya.</p>
 </header>
 <div class="main">
  <div class="card paper">
   <div class="stage" id="stage"><canvas id="paint" width="1000" height="1000"></canvas></div>
  </div>
  <div class="panel card">
   <div>
    <p class="lbl">Pilih alat</p>
    <div class="tools" id="tools">
     <button class="tool" data-t="pensil"><span>✏️</span>Pensil</button>
     <button class="tool" data-t="spidol"><span>🖊️</span>Spidol</button>
     <button class="tool" data-t="kuas"><span>🖌️</span>Kuas</button>
     <button class="tool" data-t="krayon"><span>🖍️</span>Krayon</button>
     <button class="tool" data-t="ember"><span>🪣</span>Isi warna</button>
     <button class="tool" data-t="hapus"><span>🧽</span>Penghapus</button>
    </div>
   </div>
   <div><p class="lbl">Pilih warna</p><div class="colors" id="colors"></div></div>
   <div>
    <p class="lbl">Ukuran</p>
    <div class="row">
     <div id="dot"><i id="dotI"></i></div>
     <input id="size" type="range" min="2" max="70" value="14" aria-label="Ukuran alat">
     <div id="cur" title="Warna sekarang"></div>
    </div>
   </div>
   <div class="acts">
    <button class="act alt" id="undo">↩️ Undo</button>
    <button class="act" id="clear">🗑️ Hapus semua</button>
    <button class="act save" id="save">💾 Simpan gambar</button>
   </div>
   <p id="msg" role="status"></p>
   <div id="ov" hidden><div class="box"><p>Tekan lama gambar ini (di laptop: klik kanan), lalu pilih <b>Simpan gambar</b>.</p><img id="ovImg" alt="Hasil gambarmu"><button class="act" id="ovX">Tutup</button></div></div>
  </div>
 </div>
</div>
<script>
(function(){
var W=1000,H=1000;
var cv=document.getElementById('paint'),ctx=cv.getContext('2d',{willReadFrequently:true});
var stage=document.getElementById('stage'),msg=document.getElementById('msg');
var PAL=['#ff4d4d','#ff7a3d','#ffb627','#ffe14d','#b8e04a','#4cc95a','#1f9d55','#2ec4b6','#5ad1ff','#3a86ff','#2b4bd6','#7b5cff','#b565e8','#ff6fb5','#ff9ecb','#e63e8b','#8b5a2b','#c68a53','#f1c9a0','#ffffff','#bfbfbf','#6b6b6b','#222222','#f4a6a6'];
var tool='kuas',color='#ff6fb5',size=30,drawing=false,last=null,hist=[],lastDraw='kuas';
var sizes={pensil:5,spidol:16,kuas:34,krayon:24,hapus:40,ember:14};
var sizeEl=document.getElementById('size'),dotI=document.getElementById('dotI'),cur=document.getElementById('cur'),undoB=document.getElementById('undo');
function blank(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);}
blank();
function say(t){msg.textContent=t;}

var cbox=document.getElementById('colors');
PAL.forEach(function(c){var b=document.createElement('button');b.className='sw';b.style.background=c;b.setAttribute('aria-label','Warna '+c);b.dataset.c=c;b.setAttribute('aria-pressed','false');cbox.appendChild(b);});
var cu=document.createElement('div');cu.className='sw custom';cu.title='Warna lain';cu.innerHTML='<input type="color" aria-label="Pilih warna sendiri" value="#ff6fb5">';cbox.appendChild(cu);
function setColor(c){color=c;cur.style.background=c;[].forEach.call(cbox.querySelectorAll('.sw[data-c]'),function(b){b.setAttribute('aria-pressed',b.dataset.c===c?'true':'false')});if(tool==='hapus')setTool(lastDraw);}
cbox.addEventListener('click',function(e){var b=e.target.closest('.sw[data-c]');if(b)setColor(b.dataset.c);});
cu.querySelector('input').addEventListener('input',function(e){setColor(e.target.value);});

function dotUpdate(){var d=Math.max(6,Math.min(44,size*.8));dotI.style.width=d+'px';dotI.style.height=d+'px';}
function setTool(t){tool=t;if(t!=='hapus'&&t!=='ember')lastDraw=t;
 [].forEach.call(document.querySelectorAll('.tool'),function(b){b.setAttribute('aria-pressed',b.dataset.t===t?'true':'false')});
 size=sizes[t];sizeEl.value=size;sizeEl.disabled=(t==='ember');dotUpdate();}
document.getElementById('tools').addEventListener('click',function(e){var b=e.target.closest('.tool');if(b)setTool(b.dataset.t);});
sizeEl.addEventListener('input',function(){size=+sizeEl.value;sizes[tool]=size;dotUpdate();});

function snap(){hist.push(ctx.getImageData(0,0,W,H));if(hist.length>20)hist.shift();undoB.disabled=false;}
undoB.addEventListener('click',function(){if(!hist.length)return;ctx.putImageData(hist.pop(),0,0);undoB.disabled=!hist.length;});
undoB.disabled=true;
document.getElementById('clear').addEventListener('click',function(){snap();blank();say('');});

function hex2rgb(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function fill(px,py){
 var id=ctx.getImageData(0,0,W,H),d=id.data,rgb=hex2rgb(color),o=(py*W+px)*4,tr=d[o],tg=d[o+1],tb=d[o+2];
 if(Math.abs(tr-rgb[0])+Math.abs(tg-rgb[1])+Math.abs(tb-rgb[2])<6)return;
 snap();
 var TOL=110;
 function ok(i){var k=i*4;return Math.abs(d[k]-tr)+Math.abs(d[k+1]-tg)+Math.abs(d[k+2]-tb)<=TOL;}
 var vis=new Uint8Array(W*H),stack=[px,py];
 while(stack.length){var y=stack.pop(),x=stack.pop();
  var xl=x;while(xl>=0&&!vis[y*W+xl]&&ok(y*W+xl))xl--;xl++;
  var up=false,dn=false;
  for(var xx=xl;xx<W&&!vis[y*W+xx]&&ok(y*W+xx);xx++){
   vis[y*W+xx]=1;
   if(y>0){var u=!vis[(y-1)*W+xx]&&ok((y-1)*W+xx);if(u&&!up)stack.push(xx,y-1);up=u;}
   if(y<H-1){var v=!vis[(y+1)*W+xx]&&ok((y+1)*W+xx);if(v&&!dn)stack.push(xx,y+1);dn=v;}
  }}
 for(var i=0;i<W*H;i++){if(vis[i]){var k=i*4;d[k]=rgb[0];d[k+1]=rgb[1];d[k+2]=rgb[2];d[k+3]=255;}}
 ctx.putImageData(id,0,0);
}

function pos(e){var r=stage.getBoundingClientRect(),b=8;return {x:(e.clientX-r.left-b)*W/(r.width-2*b),y:(e.clientY-r.top-b)*H/(r.height-2*b)};}
function seg(a,b){
 if(tool==='krayon'){
  var dist=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(dist/3)),R=size/2;ctx.fillStyle=color;
  for(var i=0;i<=n;i++){var t=i/n,cx=a.x+(b.x-a.x)*t,cy=a.y+(b.y-a.y)*t;
   for(var k=0;k<7;k++){var ang=Math.random()*6.283,rr=Math.sqrt(Math.random())*R;ctx.globalAlpha=.55+Math.random()*.45;
    ctx.beginPath();ctx.arc(cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr,1+Math.random()*2.4,0,6.283);ctx.fill();}}
  ctx.globalAlpha=1;return;}
 ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=size;
 ctx.strokeStyle=(tool==='hapus')?'#fff':color;
 ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
}
stage.addEventListener('pointerdown',function(e){
 e.preventDefault();var p=pos(e);say('');
 if(tool==='ember'){fill(Math.max(0,Math.min(W-1,Math.round(p.x))),Math.max(0,Math.min(H-1,Math.round(p.y))));return;}
 snap();drawing=true;last=p;stage.setPointerCapture(e.pointerId);seg(p,{x:p.x+.01,y:p.y+.01});
});
stage.addEventListener('pointermove',function(e){if(!drawing)return;e.preventDefault();var p=pos(e);seg(last,p);last=p;});
['pointerup','pointercancel'].forEach(function(n){stage.addEventListener(n,function(){drawing=false;last=null;});});

/* simpan gambar */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function makeBlob(){return new Promise(function(res){
 var o=document.createElement('canvas'),P=40;o.width=W+P*2;o.height=H+P*2;var c=o.getContext('2d');
 c.fillStyle='#fff';c.fillRect(0,0,o.width,o.height);
 c.save();rr(c,P,P,W,H,70);c.clip();c.drawImage(cv,P,P);c.restore();
 c.strokeStyle='#c96d4b';c.lineWidth=16;rr(c,P,P,W,H,70);c.stroke();
 window.lastOut=o;o.toBlob(res,'image/png');});}
function localSave(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);}
function showOv(){document.getElementById('ovImg').src=window.lastOut.toDataURL('image/png');document.getElementById('ov').hidden=false;}
document.getElementById('ovX').addEventListener('click',function(){document.getElementById('ov').hidden=true;});
document.getElementById('save').addEventListener('click',async function(){
 var name='gambar-warna-saya.png',blob=await makeBlob(),dl=null;
 try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads');}catch(e){dl=null;}
 if(dl){
  try{await dl.save({filename:name,data:blob});say('Gambar tersimpan! 🎉');}
  catch(err){if(err&&err.code==='declined'){say('Penyimpanan dibatalkan.');}else{say('Belum bisa menyimpan langsung ('+((err&&err.code)||'error')+').');showOv();}}
 }else{localSave(blob,name);say('Kalau file belum masuk unduhan, simpan lewat gambar ini.');showOv();}
});

setTool('kuas');setColor(color);
})();
</script>
</body>
</html>
